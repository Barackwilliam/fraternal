{% for f in fields %}
<label style="display:block;font-size:11px;color:var(--text-3);margin-bottom:2px">{{ f.label }}</label>
<input type="{% if f.secret %}password{% else %}text{% endif %}" name="{{ f.key }}"
       autocomplete="off" style="width:100%;margin-bottom:6px" placeholder="{{ f.help }}">
{% endfor %}
