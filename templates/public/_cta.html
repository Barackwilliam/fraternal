{% load i18n %}
<section class="section section--tint">
  <div class="cta-band reveal">
    <h3>{% trans "Jiunge na Familia ya MWST" %}</h3>
    <p>{% trans "Kuwa sehemu ya mabadiliko. Uanachama wako unasaidia elimu, afya na ustawi wa maelfu ya Watanzania." %}</p>
    <div class="hstack" style="justify-content:center;flex-wrap:wrap">
      {% if can_join %}
        <a href="{% url 'core:jiunge' %}" class="btn btn--gold"><svg><use href="#i-user-plus"></use></svg> {% trans "Jiunge Sasa" %}</a>
      {% else %}
        <a href="{% url 'core:changia' %}" class="btn btn--gold"><svg><use href="#i-hand-heart"></use></svg> {% trans "Changia Sasa" %}</a>
      {% endif %}
      <a href="{% url 'core:mawasiliano' %}" class="btn btn--ghost" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">{% trans "Wasiliana Nasi" %}</a>
    </div>
  </div>
</section>
