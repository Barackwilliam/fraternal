{% extends "public/base.html" %}
{% load i18n %}
{% block title %}{% trans "Nenosiri Limebadilishwa" %}{% endblock %}
{% block body %}
<section class="section" style="min-height:60vh;display:grid;place-items:center">
  <div class="card" style="width:min(460px,100%);text-align:center">
    <div class="card__body" style="padding:32px 26px">
      <span class="feature__ico tint-green" style="width:56px;height:56px;margin:0 auto 14px">
        <svg width="26" height="26"><use href="#i-check-circle"></use></svg>
      </span>
      <h2 style="font-size:20px;font-weight:800">{% trans "Nenosiri Limebadilishwa" %}</h2>
      <p style="font-size:13px;color:var(--muted);margin-top:8px">{% trans "Sasa unaweza kuingia kwa nenosiri lako jipya." %}</p>
      <a href="{% url 'core:login' %}" class="btn btn--primary btn--block" style="margin-top:18px">{% trans "Ingia" %}</a>
    </div>
  </div>
</section>
{% endblock %}
