{# Kadi moja ya design ya header/footer kwenye Studio. Inahitaji: item, kind. Chaguo la sasa linawekwa na JS. #}
<label class="sd-card">
  <input type="radio" name="preset" value="{{ item.key }}">
  <div class="th {% if kind == 'footer' %}f th-f-{{ item.thumb }}{% else %}th-{{ item.thumb }}{% endif %}" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
  <b>{{ item.name }}</b><span>{{ item.desc }}</span>
</label>
