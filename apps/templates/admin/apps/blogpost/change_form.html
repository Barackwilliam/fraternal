{% extends "admin/change_form.html" %}
{# Save bar inayong'ang'ania chini ya skrini — Save kila mahali, hata simuni. #}
{% block extrastyle %}{{ block.super }}
<style>
  /* Bar ya Save chini ya skrini — daima inaonekana */
  #jazzy-actions,
  form#blogpost_form .submit-row,
  .submit-row{
    position:fixed !important;left:0;right:0;bottom:0;z-index:1050;
    background:#0f172a;border-top:2px solid #6366f1;
    padding:12px 18px !important;margin:0 !important;
    display:flex !important;gap:10px;flex-wrap:wrap;
    align-items:center;justify-content:flex-start;
    box-shadow:0 -6px 22px rgba(0,0,0,.45);
  }
  #jazzy-actions .btn,#jazzy-actions input[type=submit],
  .submit-row .btn,.submit-row input[type=submit]{margin:0}
  /* Nafasi chini ili fomu isifiche nyuma ya bar */
  body,.content,#content,main.content,section.content{padding-bottom:100px !important}
  @media(max-width:576px){
    #jazzy-actions,.submit-row{padding:10px 12px !important;gap:8px}
    #jazzy-actions .btn,#jazzy-actions input[type=submit],
    .submit-row .btn,.submit-row input[type=submit]{flex:1 1 auto;min-width:110px}
  }
</style>
{% endblock %}
