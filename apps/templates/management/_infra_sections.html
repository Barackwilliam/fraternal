{% if error %}<p style="color:#ff3b5c;font-size:12px">{{ error }}</p>{% endif %}
{% for s in sections %}
<h4 style="font-size:13px;margin:12px 0 6px">{{ s.title }}</h4>
<table style="width:100%;font-size:11px;font-family:var(--mono)">
  {% for row in s.rows %}
  <tr style="border-bottom:1px solid var(--border)">
    {% for k, v in row.items %}<td style="padding:3px 6px">{{ v }}</td>{% endfor %}
  </tr>
  {% empty %}<tr><td style="padding:6px;color:var(--text-3)">—</td></tr>{% endfor %}
</table>
{% endfor %}
