{% if error %}
<div style="padding:8px 10px;border-radius:8px;background:rgba(255,59,92,.08);color:#ff3b5c;font-size:12px">{{ error }}</div>
{% else %}
<form method="post" action="{% url 'infra_attach' website.pk %}">{% csrf_token %}
  <input type="hidden" name="provider" value="{{ provider }}">
  <p style="font-size:12px;color:var(--text-3);margin:0 0 6px">{{ label }} — chagua resource:</p>
  {% for r in resources %}
  <label style="display:block;padding:6px 8px;border:1px solid var(--border);border-radius:8px;margin-bottom:4px;font-size:12px;cursor:pointer">
    <input type="radio" name="external_id" value="{{ r.external_id }}" required>
    <strong>{{ r.name }}</strong>
    <span style="font-family:var(--mono);font-size:10px;color:var(--text-3)">{{ r.external_id }}</span>
    <input type="hidden" name="name" value="{{ r.name }}">
  </label>
  {% empty %}<p style="font-size:12px;color:var(--text-3)">Hakuna resources.</p>{% endfor %}
  <button class="jt-btn" style="font-size:12px;margin-top:6px">Unganisha</button>
</form>
{% endif %}
