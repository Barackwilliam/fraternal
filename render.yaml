services:
  - type: web
    name: jamiitek
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn jamiitek.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"

      # ── Weka thamani hizi kwa mkono kwenye Render → Environment ──
      # (sync: false inamaanisha Render haitazizalisha; wewe unaziweka)
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false

      # Database (Supabase pooler)
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false

      # Encryption ya credentials za integrations — IKIPOTEA, HAZISOMEKI TENA
      - key: FERNET_KEY
        sync: false
      - key: CRON_TOKEN
        sync: false

      # AI
      - key: GROQ_API_KEY
        sync: false

      # Email (Gmail app password)
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

      # Media
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: UPLOADCARE_PUB_KEY
        sync: false
      - key: UPLOADCARE_SECRET
        sync: false

      # WhatsApp Business
      - key: WHATSAPP_MASTER_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WILLIAM_WHATSAPP
        sync: false
      - key: WILLIAM_PHONE_NUMBER_ID
        sync: false

      # Cloudflare Turnstile (hiari — ikiachwa tupu, inazimika yenyewe)
      - key: TURNSTILE_SITEKEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
